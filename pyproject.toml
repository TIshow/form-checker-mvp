[project]
name = "form-analyzer"
version = "0.2.0"
description = "3D姿勢データからバイオメカ指標と改善フィードバックを生成する（テニス/ゴルフ/野球/オペラ）"
readme = "README.md"
requires-python = ">=3.10"

# 解析層は numpy のみに依存する。3D復元 (GVHMR) は Colab 側の
# Python 3.10 環境で動かすため、ここには含めない。
dependencies = [
    "numpy>=1.23",
]

[project.optional-dependencies]
refine = [
    "scipy>=1.10,<2",
]
dev = [
    "pytest>=7.4",
]
# レポートをグラフ化する場合のみ
plot = [
    "matplotlib>=3.7",
]
# 動画そのものを読む道具（tools/camera_motion.py）を使う場合のみ
video = [
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "domains", "analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-v"]
