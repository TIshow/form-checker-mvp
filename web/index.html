<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>テニスサーブ解析</title>
<style>
  :root { --bg:#0f1216; --card:#1a1f27; --line:#2a323d; --fg:#e7ecf2; --muted:#94a3b8;
          --accent:#2563eb; --warn:#f59e0b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family: -apple-system, "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
         line-height:1.6; }
  header { padding:20px 24px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:18px; font-weight:600; }
  header p { margin:4px 0 0; color:var(--muted); font-size:13px; }
  main { max-width:1040px; margin:0 auto; padding:24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:18px 20px; margin-bottom:16px; }
  label { display:block; font-size:13px; color:var(--muted); margin:0 0 6px; }
  input[type=file], input[type=number] {
    background:#11151b; color:var(--fg); border:1px solid var(--line);
    border-radius:8px; padding:9px 11px; font-size:14px; width:100%; }
  .row { display:flex; gap:16px; flex-wrap:wrap; align-items:end; }
  .row > div { flex:1; min-width:180px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px;
           padding:11px 20px; font-size:14px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .status { color:var(--muted); font-size:14px; }
  .hidden { display:none; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:820px){ .grid { grid-template-columns:1fr; } }
  .fb { border-left:3px solid var(--accent); padding:10px 14px; margin:0 0 12px;
        background:#121720; border-radius:0 8px 8px 0; }
  .fb .t { font-weight:600; }
  .fb .d { color:var(--muted); font-size:13px; }
  .fb .c { margin-top:4px; }
  .fb.tierA { border-color:#22c55e; } .fb.tierB { border-color:var(--warn); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td { padding:6px 4px; border-bottom:1px solid var(--line); }
  td.k { color:var(--muted); } td.v { text-align:right; font-variant-numeric:tabular-nums; }
  #viewer { width:100%; height:420px; background:#0b0e12; border-radius:8px; }
  .vctl { display:flex; gap:12px; align-items:center; margin-top:10px; font-size:13px;
          color:var(--muted); }
  .vctl input[type=range]{ flex:1; }
  .warn { color:var(--warn); font-size:13px; margin-top:8px; }
  .note { color:var(--muted); font-size:12px; margin-top:6px; }
  a.small { color:var(--muted); font-size:12px; }
  .sw { width:20px; height:20px; border-radius:50%; cursor:pointer; display:inline-block;
        border:2px solid transparent; }
  .sw.active { border-color:#fff; box-shadow:0 0 0 1px #000; }
  #drawTools.off { opacity:.5; }
</style>
</head>
<body>
<header>
  <h1>🎾 テニスサーブ解析</h1>
  <p>動画をアップロードすると、3Dで復元してフォームのフィードバックを返します。</p>
</header>

<main>
  <div class="card" id="uploadCard">
    <div class="row">
      <div>
        <label>サーブ動画（三脚固定・全身が映るもの）</label>
        <input type="file" id="file" accept="video/*" />
      </div>
      <div style="max-width:140px">
        <label>撮影fps</label>
        <input type="number" id="fps" value="30" min="1" max="240" />
      </div>
      <div style="flex:0 0 auto">
        <button id="go" disabled>解析する</button>
      </div>
    </div>
    <div class="note">※ 3D復元はクラウドGPUで行うため、結果まで数分かかります。
      キネティックチェーン（力の伝達順序）の評価には120fps以上が必要です。</div>
  </div>

  <div class="card hidden" id="progressCard">
    <div class="status" id="status">準備中…</div>
  </div>

  <div id="results" class="hidden">
    <div class="grid">
      <div class="card">
        <h3 style="margin-top:0">改善ポイント</h3>
        <div id="feedback"></div>
        <div id="fpsWarn" class="warn hidden"></div>
        <div id="fpsNote" class="note hidden"></div>
      </div>
      <div class="card">
        <h3 style="margin-top:0">主要数値</h3>
        <table id="metrics"></table>
      </div>
    </div>
    <div class="card hidden" id="overlayCard">
      <h3 style="margin-top:0">現実との重ね合わせ ＋ 別角度の3D</h3>
      <video id="overlayVideo" controls loop playsinline
             style="width:100%;border-radius:8px;background:#000;max-height:520px"></video>
      <div class="note">左: 元動画に復元3Dメッシュを重ねたもの（体に合っているほど復元が正確）／右: 同じ動きを別角度の3Dで。</div>
    </div>
    <div class="card">
      <h3 style="margin-top:0">3Dフォーム</h3>
      <div id="viewerWrap" style="position:relative">
        <div id="viewer"></div>
        <canvas id="draw" style="position:absolute; inset:0; touch-action:none;
                pointer-events:none; border-radius:8px;"></canvas>
      </div>
      <div class="vctl">
        <button id="play" style="padding:6px 14px">⏸</button>
        <input type="range" id="frame" min="0" value="0" />
        <span id="frameLabel">0</span>
        <button id="avatarBtn" style="padding:6px 12px; background:#374151" disabled>🧍 アバター</button>
      </div>
      <div class="vctl" id="drawTools">
        <button id="modeBtn" style="padding:6px 12px">✏️ 描き込み</button>
        <span class="sw" data-c="#ef4444" style="background:#ef4444"></span>
        <span class="sw" data-c="#fbbf24" style="background:#fbbf24"></span>
        <span class="sw" data-c="#22d3ee" style="background:#22d3ee"></span>
        <span class="sw" data-c="#ffffff" style="background:#ffffff"></span>
        <button id="clearBtn" style="padding:6px 12px; background:#374151">消去</button>
      </div>
      <div class="note" id="viewerNote">ドラッグで回転・スクロールでズーム。オレンジ=沈み込み、赤=打点。</div>
    </div>
  </div>

  <p><a class="small" href="#" id="loadSample">（サンプル結果を読み込む）</a></p>
</main>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
  "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.js"
}}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { createAvatar } from "./avatar.js";

const API = "https://tishow--serve-api.modal.run";
// SMPL 24関節の親子（骨）
const BONES = [[1,0],[2,0],[3,0],[4,1],[5,2],[6,3],[7,4],[8,5],[9,6],[10,7],
  [11,8],[12,9],[13,9],[14,9],[15,12],[16,13],[17,14],[18,16],[19,17],
  [20,18],[21,19],[22,20],[23,21]];
const FOOT_IDS = [7, 8, 10, 11];   // 左右の足首・つま先

const $ = (id) => document.getElementById(id);
const fileEl = $("file"), goEl = $("go");
fileEl.onchange = () => { goEl.disabled = !fileEl.files.length; };

goEl.onclick = async () => {
  const f = fileEl.files[0]; if (!f) return;
  const fps = parseFloat($("fps").value) || 30;
  show("progressCard"); $("results").classList.add("hidden");
  setStatus("動画を送信中…");
  const b64 = await toBase64(f);
  let job;
  try {
    const r = await fetch(API + "/submit", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ video_b64:b64, name:f.name, fps }) });
    job = (await r.json()).job_id;
  } catch(e){ setStatus("送信に失敗しました: " + e); return; }

  const t0 = Date.now();
  const poll = async () => {
    const el = Math.round((Date.now()-t0)/1000);
    try {
      const r = await fetch(`${API}/result?job_id=${job}`);
      const s = await r.json();
      if (s.status === "done") { setStatus(""); render(s.result, fps); return; }
      if (s.status === "error") { setStatus("解析エラー: " + s.message); return; }
      setStatus(`解析中… ${el}秒（3D復元に数分かかります）`);
    } catch(e){ setStatus(`通信待ち… ${el}秒`); }
    setTimeout(poll, 5000);
  };
  poll();
};

$("loadSample").onclick = async (e) => {
  e.preventDefault(); show("progressCard"); setStatus("サンプルを読み込み中…");
  try {
    const r = await fetch("result_sample.json");
    render(await r.json(), 30);
    setStatus("");
  } catch(err){ setStatus("サンプルが見つかりません（result_sample.json）"); }
};

function toBase64(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = () => res(r.result.split(",")[1]);
    r.onerror = rej; r.readAsDataURL(file);
  });
}
function show(id){ $("progressCard").classList.remove("hidden");
  $("uploadCard").scrollIntoView({behavior:"smooth"}); }
function setStatus(t){ $("status").textContent = t;
  if(!t) $("progressCard").classList.add("hidden"); }

function render(result, fps){
  $("results").classList.remove("hidden");
  const m = result.metrics, ph = m.phases;

  // フィードバック
  const fb = $("feedback"); fb.innerHTML = "";
  if(!result.feedback.length){
    fb.innerHTML = '<div class="fb tierA"><div class="t">大きな問題は検出されませんでした</div></div>';
  }
  for(const f of result.feedback.slice(0,2)){
    const d = document.createElement("div");
    d.className = "fb tier" + (f.tier||"");
    d.innerHTML = `<div class="t">${f.title}</div><div class="d">${f.detail||""}</div>`+
                  `<div class="c">→ ${f.cue||""}</div>`;
    fb.appendChild(d);
  }
  // 動画から読めた fps と申告値が食い違ったら、黙って上書きせず知らせる
  const noteEl = $("fpsNote");
  if(result.video_fps && Math.abs(result.video_fps - fps) > 1){
    noteEl.classList.remove("hidden");
    noteEl.textContent = `ℹ️ 申告は ${fps}fps でしたが、動画から `
      + `${result.video_fps.toFixed(2)}fps を検出したのでそちらで解析しました。`
      + `スローモーションとして保存された動画なら実際の撮影レートはさらに高いので、`
      + `その場合は手で指定してください。`;
  } else { noteEl.classList.add("hidden"); }

  const usedFps = result.fps_used || fps;
  const warn = $("fpsWarn");
  if(usedFps < 60){ warn.classList.remove("hidden");
    warn.textContent = "⚠️ 力の伝達順序（キネティックチェーン）は "+usedFps.toFixed(0)+
      "fps では判定できません。120fps以上で撮ると評価できます。"; }
  else warn.classList.add("hidden");

  // 主要数値
  const rows = [
    ["利き手(推定)", m.racket_side === "R" ? "右" : "左"],
    ["沈み込み", `frame ${ph.loading}（${(ph.loading/m.fps).toFixed(2)}s）`],
    ["打点", `frame ${ph.contact}（${(ph.contact/m.fps).toFixed(2)}s）`],
    ["重心の伸び上がり", `${(m.com_rise_m*100).toFixed(1)} cm / ${m.drive_time_s.toFixed(2)} 秒`],
    ["沈み込み膝角", `${m.min_knee_deg_overall.toFixed(0)}°（プロ約115°）`],
    ["打点タイミング", `${m.contact_vs_compeak_s>=0?"+":""}${m.contact_vs_compeak_s.toFixed(2)} 秒（0が理想）`],
    ["打点の肘角", `${m.elbow_at_contact_deg.toFixed(0)}°（プロ約150°）`],
  ];
  $("metrics").innerHTML = rows.map(([k,v])=>
    `<tr><td class="k">${k}</td><td class="v">${v}</td></tr>`).join("");

  // 現実+3D重ね合わせ動画（あれば）
  const card = $("overlayCard"), vid = $("overlayVideo");
  if(result.overlay_video_b64){
    const bin = atob(result.overlay_video_b64);
    const arr = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    if(vid.src) URL.revokeObjectURL(vid.src);
    vid.src = URL.createObjectURL(new Blob([arr], {type:"video/mp4"}));
    card.classList.remove("hidden");
  } else {
    card.classList.add("hidden");
  }

  initViewer(result.joints, result.up_axis, ph, result.pose,
             m.racket_side === 'L' ? 'left' : 'right', m.fps || fps);
}

// ---- 描き込み（2Dオーバーレイ）----
// 静止フレームに指/ペンで描ける。コーチが角度を決めて説明するのに使う。
// 描画は画面座標なので、3Dを回すと合わなくなる → 描き込み中は回転を止める。
const drawState = { mode:"orbit", color:"#ef4444", drawing:false,
                    ctx:null, controls:null, pause:null };
let drawWired = false;
function wireDrawOnce(){
  if(drawWired) return; drawWired = true;
  const cv = $("draw");
  const p = (e) => { const r = cv.getBoundingClientRect();
    return { x:e.clientX - r.left, y:e.clientY - r.top }; };
  cv.onpointerdown = (e) => {
    if(drawState.mode!=="draw") return;
    drawState.drawing = true; cv.setPointerCapture(e.pointerId);
    const {x,y} = p(e); const c = drawState.ctx;
    c.strokeStyle = drawState.color; c.lineWidth = 4;
    c.lineCap = "round"; c.lineJoin = "round";
    c.beginPath(); c.moveTo(x,y);
  };
  cv.onpointermove = (e) => {
    if(!drawState.drawing) return;
    const {x,y} = p(e); drawState.ctx.lineTo(x,y); drawState.ctx.stroke();
  };
  cv.onpointerup = cv.onpointercancel = () => { drawState.drawing = false; };

  $("modeBtn").onclick = () => {
    const toDraw = drawState.mode==="orbit";
    drawState.mode = toDraw ? "draw" : "orbit";
    if(drawState.controls) drawState.controls.enabled = !toDraw;
    cv.style.pointerEvents = toDraw ? "auto" : "none";
    $("modeBtn").textContent = toDraw ? "🔄 回転に戻る" : "✏️ 描き込み";
    $("drawTools").classList.toggle("off", !toDraw);
    $("viewerNote").textContent = toDraw
      ? "描き込みモード: 指/マウスで線を引けます（回転は停止中）。"
      : "ドラッグで回転・スクロールでズーム。オレンジ=沈み込み、赤=打点。";
    if(toDraw && drawState.pause) drawState.pause();  // 静止フレームに描く
  };
  $("clearBtn").onclick = () => {
    const cv2 = $("draw");
    drawState.ctx.clearRect(0,0,cv2.width,cv2.height);
  };
  document.querySelectorAll(".sw").forEach(sw => {
    sw.onclick = () => {
      drawState.color = sw.dataset.c;
      document.querySelectorAll(".sw").forEach(s=>s.classList.remove("active"));
      sw.classList.add("active");
    };
  });
  document.querySelector(".sw").classList.add("active");
}
function setupDrawCanvas(W, H, controls, pauseFn){
  wireDrawOnce();
  const cv = $("draw"), dpr = window.devicePixelRatio || 1;
  cv.width = W*dpr; cv.height = H*dpr; cv.style.width = W+"px"; cv.style.height = H+"px";
  const ctx = cv.getContext("2d"); ctx.scale(dpr,dpr);
  drawState.ctx = ctx; drawState.controls = controls; drawState.pause = pauseFn;
  // 別解析に切り替わったらモードと描画をリセット
  drawState.mode = "orbit"; controls.enabled = true;
  cv.style.pointerEvents = "none"; $("modeBtn").textContent = "✏️ 描き込み";
  $("drawTools").classList.add("off"); ctx.clearRect(0,0,cv.width,cv.height);
}

// ---- 3Dビューア ----
let viewerState = null;
// fps は必ず引数で受け取る。受け取らないと、モジュール内の裸の `fps` が
// 同名の要素 id="fps" (window.fps) に解決され、1000/fps が NaN になる。
function initViewer(joints, upAxis, ph, pose, racketSide, fps){
  const host = $("viewer"); host.innerHTML = "";
  // 非表示中などで幅が取れないことがある。0のまま初期化すると何も描画されない。
  const size = () => [host.clientWidth || host.parentElement?.clientWidth || 800,
                      host.clientHeight || 420];
  let [W, H] = size();
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, W/H, 0.01, 100);
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(W,H); renderer.setPixelRatio(window.devicePixelRatio);
  host.appendChild(renderer.domElement);
  const controls = new OrbitControls(camera, renderer.domElement);

  // 上軸をThree.jsの+yに合わせて表示座標へ変換し、中心化
  const [upAx, upSign] = upAxis;
  const horiz = [0,1,2].filter(a=>a!==upAx);
  const F = joints.length, J = joints[0].length;
  const disp = joints.map(fr => fr.map(p =>
    [ p[horiz[0]], p[upAx]*upSign, p[horiz[1]] ]));
  // 水平は全フレーム平均で中心化。縦は「足元を床(0)に」揃える。
  // 縦も平均で中心化すると体が床から浮いて見え、さらに床グリッドを
  // 「クリップ中で最も低かった点」に置くと、途中で一度でも沈んだ瞬間や
  // 復元のドリフトが床になってしまう。基準は最低値ではなく**中央値**を使う。
  const c=[0,0]; let n=0;
  for(const fr of disp) for(const p of fr){ c[0]+=p[0]; c[1]+=p[2]; n++; }
  c.forEach((_,i)=>c[i]/=n);
  const lows = disp.map(fr => Math.min(...FOOT_IDS.map(i=>fr[i][1]))).sort((a,b)=>a-b);
  const ground = lows[Math.floor(lows.length/2)];
  for(const fr of disp) for(const p of fr){ p[0]-=c[0]; p[1]-=ground; p[2]-=c[1]; }

  scene.add(new THREE.HemisphereLight(0xffffff,0x444444,1.2));
  const key = new THREE.DirectionalLight(0xffffff, 1.1);
  key.position.set(2,3,2); scene.add(key);   // アバターの陰影用
  const grid = new THREE.GridHelper(4,8,0x333a44,0x222831);   // 床は 0 に固定
  scene.add(grid);

  // 骨と関節
  const skel = new THREE.Group(); scene.add(skel);
  const boneGeom = new THREE.BufferGeometry();
  const bonePos = new Float32Array(BONES.length*2*3);
  boneGeom.setAttribute("position", new THREE.BufferAttribute(bonePos,3));
  const boneMat = new THREE.LineBasicMaterial({color:0x9db2cc});
  skel.add(new THREE.LineSegments(boneGeom, boneMat));
  const jointMat = new THREE.MeshBasicMaterial({color:0x2563eb});
  const spheres = [];
  for(let j=0;j<J;j++){
    const s = new THREE.Mesh(new THREE.SphereGeometry(0.022,10,10), jointMat.clone());
    skel.add(s); spheres.push(s);
  }
  // 足元が 0 になったので、注視点は体の中ほど（腰の高さ）に置く
  camera.position.set(2.4,1.3,2.4); controls.target.set(0,0.9,0);

  function setFrame(i){
    const fr = disp[i];
    for(let j=0;j<J;j++) spheres[j].position.set(fr[j][0],fr[j][1],fr[j][2]);
    let k=0;
    for(const [a,b] of BONES){
      bonePos[k++]=fr[a][0]; bonePos[k++]=fr[a][1]; bonePos[k++]=fr[a][2];
      bonePos[k++]=fr[b][0]; bonePos[k++]=fr[b][1]; bonePos[k++]=fr[b][2];
    }
    boneGeom.attributes.position.needsUpdate = true;
    // 打点/沈み込みで色を変える
    const col = i===ph.contact ? 0xef4444 : i===ph.loading ? 0xf59e0b : 0x2563eb;
    for(const s of spheres) s.material.color.setHex(col);
    if(avatar) avatar.applyFrame(i, hipsAt(i));
    $("frame").value = i; $("frameLabel").textContent = i;
  }

  // アバターの腰位置。骨格と同じ表示座標に置いて重なるようにする。
  const hipsVec = new THREE.Vector3();
  const hipsAt = (i) => hipsVec.set(disp[i][0][0], disp[i][0][1], disp[i][0][2]);

  const slider = $("frame"); slider.max = F-1; slider.value = 0;
  slider.oninput = () => { pause(); setFrame(parseInt(slider.value)); };
  let playing = true, cur = 0, last = 0;
  const playBtn = $("play");
  function pause(){ playing=false; playBtn.textContent="▶"; }
  function play(){ playing=true; playBtn.textContent="⏸"; }
  playBtn.onclick = () => playing ? pause() : play();

  // 描き込みオーバーレイを viewer の大きさに合わせて用意
  setupDrawCanvas(W, H, controls, pause);

  // 表示サイズが後から確定/変化しても追従する（描き込みは消える）
  new ResizeObserver(() => {
    const [w, h] = size();
    if (w === W && h === H) return;
    [W, H] = [w, h];
    camera.aspect = w / h; camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    setupDrawCanvas(w, h, controls, pause);
  }).observe(host);

  // ---- アバター（issue #5）。回転が来ているときだけ読み込む ----
  let avatar = null, showAvatar = false;
  const avBtn = $("avatarBtn");
  if(pose && pose.body_pose){
    // 回転は SMPL のワールド座標系。表示座標への軸入れ替えが恒等でないと
    // 骨格とアバターの向きがずれる（up軸が +Y のとき恒等）。
    if(!(upAx === 1 && upSign === 1)) {
      console.warn("up軸が+Yではないため、アバターの向きが骨格とずれる可能性があります", upAxis);
    }
    avBtn.textContent = "🧍 読み込み中…";
    createAvatar("avatar/avatar.vrm", joints, pose).then(a => {
      if(viewerState !== state){ return; }  // 別解析に切り替わっていたら破棄
      avatar = a; scene.add(a.root); a.setVisible(false);
      a.attachRacket(racketSide);
      console.log("[avatar] レストポーズ補正:", a.report);
      avBtn.disabled = false; avBtn.textContent = "🧍 アバター";
      setFrame(cur);
    }).catch(e => {
      console.error("[avatar] 読み込み失敗", e);
      avBtn.textContent = "🧍 なし"; avBtn.title = String(e);
    });
  } else {
    avBtn.textContent = "🧍 なし"; avBtn.title = "この結果には回転(pose)が含まれていません";
  }
  avBtn.onclick = () => {
    if(!avatar) return;
    showAvatar = !showAvatar;
    avatar.setVisible(showAvatar); skel.visible = !showAvatar;
    avBtn.textContent = showAvatar ? "🦴 骨格" : "🧍 アバター";
    avBtn.style.background = showAvatar ? "var(--accent)" : "#374151";
  };

  let prevT = 0;
  function loop(t){
    if(viewerState !== state) return; // 別解析に切り替わったら停止
    controls.update();
    if(playing && t-last > (1000/fps)){ cur=(cur+1)%F; setFrame(cur); last=t; }
    if(avatar) avatar.update(Math.min((t-prevT)/1000, 0.1));
    prevT = t;
    renderer.render(scene,camera);
    requestAnimationFrame(loop);
  }
  const state = {}; viewerState = state;
  setFrame(0); play(); requestAnimationFrame(loop);
}
</script>
</body>
</html>
