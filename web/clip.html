<meta charset="utf-8" />
<title>フォーム解析</title>
<style>
  :root { --bg:#0b0e12; --card:#141a22; --line:#232b36; --fg:#e6edf5;
          --mute:#93a1b3; --warn:#fcd9a0; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.65 -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width:1280px; margin:0 auto; padding:20px 18px 60px; }
  h1 { font-size:21px; margin:0 0 4px; font-weight:600; }
  .sub { color:var(--mute); font-size:13px; margin:0 0 18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:14px; margin-bottom:16px; }
  h2 { font-size:15px; margin:0 0 10px; font-weight:600; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  button, select { background:#1c2632; color:var(--fg); border:1px solid var(--line);
           border-radius:8px; padding:7px 13px; font-size:14px; cursor:pointer; }
  button.on { background:#2563eb; border-color:#2563eb; }
  button.phase { font-size:13px; padding:6px 11px; }
  button.phase .tag { width:9px; height:9px; border-radius:3px;
                      display:inline-block; margin-right:6px; }
  input[type=range] { flex:1; min-width:260px; accent-color:#2563eb; }
  /* minmax(0,1fr) が要点。これが無いと列は内容より狭くならず、
     キャンバスが列を押し広げ続ける増幅ループになる。 */
  #stage { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  .box { background:#080b0f; border:1px solid var(--line); border-radius:8px;
         height:440px; overflow:hidden; display:flex; align-items:center;
         justify-content:center; }
  .box canvas, .box video { display:block; width:100%; height:100%; object-fit:contain; }
  h4 { margin:0 0 6px; font-size:13px; font-weight:600; color:var(--mute); }
  .meta { color:var(--mute); font-size:12px; margin-top:6px;
          font-variant-numeric:tabular-nums; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { padding:8px 9px; border-bottom:1px solid var(--line); text-align:left;
           font-variant-numeric:tabular-nums; }
  th { color:var(--mute); font-weight:500; }
  td.val { font-size:17px; font-weight:600; }
  td.na { color:var(--mute); font-weight:400; font-size:14px; }
  .dir { color:var(--mute); font-size:12px; }
  .note { color:var(--mute); font-size:13px; margin-top:10px; }
  .finding { border-left:3px solid var(--accent, #4a9); padding:6px 10px; margin:8px 0; }
  #coach h3 { font-size:14px; margin:14px 0 6px; }
  .warn { background:#2a1f14; border:1px solid #7c5a1e; color:var(--warn);
          border-radius:8px; padding:10px 12px; font-size:13px; margin-bottom:14px; }
  @media (max-width:900px) { #stage { grid-template-columns:1fr; } }
</style>

<main>
  <h1 id="title">読み込み中…</h1>
  <p class="sub" id="sub"></p>

  <div id="note" class="warn" hidden></div>

  <div class="card">
    <div id="stage">
      <div><h4>元の映像</h4><div class="box" id="videoBox"></div></div>
      <div><h4 id="skelTitle">3D復元</h4><div class="box" id="skelBox"></div></div>
    </div>

    <div class="row" style="margin-top:12px">
      <button id="play">▶ 再生</button>
      <label class="meta">速度
        <select id="speed">
          <option value="1">1x</option>
          <option value="0.5">1/2</option>
          <option value="0.25" selected>1/4</option>
          <option value="0.1">1/10</option>
        </select>
      </label>
      <input type="range" id="scrub" min="0" value="0" />
      <button id="viewBtn" title="回して見たあと、元映像と同じ横向きの視点に戻す">↺ 映像と同じ視点</button>
    </div>
    <div class="row" id="phases" style="margin-top:10px"></div>
    <div class="meta" id="meta"></div>
    <div id="stripWrap" hidden style="margin-top:12px">
      <div class="row" style="justify-content:space-between">
        <div class="meta" id="stripLegend"></div>
        <label class="meta"><input type="checkbox" id="sound"> 音を出して再生（3D は動画に追従）</label>
      </div>
      <canvas id="strip" style="width:100%;height:150px;display:block;border-radius:8px;background:#0c1118;cursor:crosshair"></canvas>
    </div>
  </div>

  <div class="card" id="rendersCard" hidden>
    <h2>復元手法が描いたレンダ</h2>
    <div id="renders" class="row" style="align-items:flex-start"></div>
    <p class="note">手法自身のメッシュ描画。棒人間は関節位置だけなので、手法が推定した「体」を見るにはこちら。スクラブに同期する。</p>
  </div>

  <div class="card">
    <h2>計測値</h2>
    <table id="metrics"></table>
    <p class="note" id="judged"></p>
  </div>

  <div class="card" id="coachCard" hidden>
    <h2>改善点（生成AI・根拠付き）</h2>
    <div id="coach"></div>
    <p class="note">生成AIには、この画面の計測値と <code>domains/&lt;domain&gt;_evidence.py</code> の根拠表だけを渡している。
      「改善点」と書けるのは根拠表の Tier A/B（力学的原理、または本文を確認した文献）に結びついたものだけで、
      根拠 id は機械的に照合している。Tier C は「観察」として数値を述べるだけ。プロとの比較は含まない。</p>
  </div>
</main>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import { createPane, toDisplayDir } from "./skeleton.js";

const $ = id => document.getElementById(id);
const hex = n => "#" + n.toString(16).padStart(6, "0");

function metricsTable(clip) {
  const rows = clip.headline.map(h => {
    // value が null＝「測れなかった」。NaN を握り潰して 0 を出すより、
    // 測れないと書く方が常に良い（指標の向きを誤読させない）。
    const na = h.value === null || h.value === undefined;
    const v = na ? "測定できません"
                 : `${h.value.toFixed(h.digits)}${h.unit ? " " + h.unit : ""}`;
    return `<tr><th>${h.label}</th>`
         + `<td class="${na ? "na" : "val"}">${v}</td>`
         + `<td class="dir">${h.note || ""}</td></tr>`;
  });
  $("metrics").innerHTML = rows.join("");
}

// 声量・響き・姿勢を同じ時間軸に描く帯。clip.audio が無ければ何もしない
function buildStrip(clip, frames, seek) {
  if (!clip.audio) return null;
  const wrap = $("stripWrap"), cv = $("strip"), ctx = cv.getContext("2d");
  wrap.hidden = false;
  const A = clip.audio.series, S = clip.series || {};
  const lanes = [
    { key: "rms_db", vals: A.rms_db.values, lo: -50, hi: 0, color: "#5b8def", fill: true, label: A.rms_db.label + " [dB]" },
    { key: "spr_db", vals: A.spr_db.values, lo: -35, hi: 5, color: "#f2b84b", label: A.spr_db.label + " [dB]" },
    { key: "f0_hz", vals: A.f0_hz.values, lo: 80, hi: 900, color: "#8ee0a1", label: A.f0_hz.label + " [Hz]" },
  ];
  const postureKey = S.trunk_lean_deg ? "trunk_lean_deg" : (Object.keys(S)[0] || null);
  if (postureKey) {
    const v = S[postureKey].values.filter(Number.isFinite);
    const c = v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0;
    lanes.push({ key: postureKey, vals: S[postureKey].values, lo: c - 6, hi: c + 6, color: "#e88aa8",
                 label: S[postureKey].label + ` [${S[postureKey].unit}]（平均±6）` });
  }
  const voiced = clip.audio.voiced;
  $("stripLegend").innerHTML = lanes.map(l => `<span style="color:${l.color}">■</span> ${l.label}`).join("　");
  function draw(f) {
    const W = cv.clientWidth, H = 150;
    if (cv.width !== W * devicePixelRatio) { cv.width = W * devicePixelRatio; cv.height = H * devicePixelRatio; }
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const laneH = H / lanes.length, x = i => (i + 0.5) / frames * W;
    // 有声区間を薄く塗る
    ctx.fillStyle = "rgba(255,255,255,0.05)";
    for (let i = 0; i < frames; i++) if (voiced[i]) ctx.fillRect(i / frames * W, 0, W / frames + 0.5, H);
    lanes.forEach((l, k) => {
      const y0 = k * laneH, y = v => y0 + laneH - 3 - (Math.max(l.lo, Math.min(l.hi, v)) - l.lo) / (l.hi - l.lo) * (laneH - 6);
      ctx.strokeStyle = "rgba(255,255,255,0.12)"; ctx.beginPath(); ctx.moveTo(0, y0 + laneH); ctx.lineTo(W, y0 + laneH); ctx.stroke();
      ctx.strokeStyle = l.color; ctx.fillStyle = l.color + "55"; ctx.lineWidth = 1.5;
      let open = false;
      ctx.beginPath();
      for (let i = 0; i < frames; i++) {
        const v = l.vals[i];
        if (v === null || v === undefined || !Number.isFinite(v)) { open = false; continue; }
        if (!open) { ctx.moveTo(x(i), y(v)); open = true; } else ctx.lineTo(x(i), y(v));
      }
      ctx.stroke();
      if (l.fill) { ctx.lineTo(W, y0 + laneH); ctx.lineTo(0, y0 + laneH); ctx.closePath(); ctx.fill(); }
      const v = l.vals[f];
      ctx.fillStyle = l.color; ctx.font = "11px system-ui";
      ctx.fillText(`${l.label}: ${v === null || v === undefined ? "—" : (+v).toFixed(1)}`, 6, y0 + 12);
    });
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x(f), 0); ctx.lineTo(x(f), H); ctx.stroke();
  }
  cv.onclick = e => seek(Math.floor((e.offsetX / cv.clientWidth) * frames));
  return { draw };
}

function audioSummary(clip) {
  if (!clip.audio) return;
  const rows = clip.audio.summary.map(h => {
    const na = h.value === null || h.value === undefined;
    const v = na ? "測定できません" : `${(+h.value).toFixed(h.digits)}${h.unit ? " " + h.unit : ""}`;
    return `<tr><th>🎤 ${h.label}</th><td class="${na ? "na" : "val"}">${v}</td><td class="dir">${h.note || ""}</td></tr>`;
  });
  $("metrics").insertAdjacentHTML("beforeend", rows.join(""));
  $("judged").insertAdjacentText("beforeend", "　音声は同一録音内の相対値。帯域の出典は未確認で、良し悪しは判定しない（core/audio.py）。");
}

async function coachPanel(base) {
  let c;
  try { const r = await fetch(base + "coach.json"); if (!r.ok) return; c = await r.json(); } catch (e) { return; }
  const esc = s => String(s ?? "").replace(/[&<>]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[ch]));
  const imp = (c.improvements || []).map(i =>
    `<div class="finding"><b>${esc(i.title)}</b> <span class="meta">［根拠 ${esc(i.evidence_id)}・確信 ${esc(i.confidence)}］</span>`
    + `<div class="meta">${esc(i.metric)}: ${esc(i.observed)}</div>`
    + `<div>${esc(i.why)}</div><div>→ ${esc(i.advice)}</div></div>`).join("")
    || `<p class="meta">根拠表の Tier A/B に結びつく改善点はありません（根拠なしに欠点は書きません）。</p>`;
  const obs = (c.observations || []).map(o =>
    `<li><b>${esc(o.metric)}</b> ${esc(o.observed)} — ${esc(o.note)}</li>`).join("");
  const nm = (c.not_measured || []).map(esc).map(s => `<li>${s}</li>`).join("");
  const cv = (c.caveats || []).map(esc).map(s => `<li>${s}</li>`).join("");
  $("coach").innerHTML = `<h3>改善点</h3>${imp}`
    + (obs ? `<h3>観察（判定しない）</h3><ul>${obs}</ul>` : "")
    + (nm ? `<h3>この計測では取れていないもの</h3><ul>${nm}</ul>` : "")
    + (cv ? `<h3>限界</h3><ul>${cv}</ul>` : "")
    + `<p class="meta">生成: ${esc(c.generated_by)} ${esc(c.generated_at)}${c.demoted ? `・根拠照合で ${c.demoted} 件を観察に降格` : ""}</p>`;
  $("coachCard").hidden = false;
}

async function main() {
  // ?clip=<name> で web/data/<name>/clip.json を読む（複数のデモを並存させる）
  const name = new URLSearchParams(location.search).get("clip") || "";
  const base = name ? `data/${name}/` : "data/";
  let clip;
  try {
    clip = await (await fetch(base + "clip.json")).json();
  } catch (e) {
    $("title").textContent = `${base}clip.json を読めません`;
    $("sub").textContent = "tools/make_clip.py で生成してください。";
    return;
  }

  $("title").textContent = clip.label;
  $("sub").textContent =
    `${clip.domain_label}　${clip.metrics.n_frames}フレーム @${clip.fps.toFixed(0)}fps`
    + ((clip.video_fps && clip.video_fps !== clip.fps) ? `（スロー映像・再生 ${clip.video_fps.toFixed(0)}fps）` : "");
  if (clip.note) { $("note").textContent = "⚠️ " + clip.note; $("note").hidden = false; }
  metricsTable(clip);
  audioSummary(clip);
  coachPanel(base);
  $("judged").textContent = clip.judged
    ? ""
    : "このドメインはまだ判定ルールを持っていません（計測値の表示のみ）。"
      + "閾値は出典を確認してから入れます。";

  // 元動画。無ければ骨格だけを全幅で出す
  let video = null;
  if (clip.video) {
    video = document.createElement("video");
    video.src = base + clip.video;
    video.muted = true;
    video.playsInline = true;
    video.preload = "auto";
    $("videoBox").appendChild(video);
  } else {
    $("videoBox").parentElement.remove();
    $("stage").style.gridTemplateColumns = "minmax(0,1fr)";
  }

  // 手法のレンダ動画（あれば）。同じ時刻へシークする
  const renderVideos = [];
  if (clip.renders && clip.renders.length) {
    $("rendersCard").hidden = false;
    for (const r of clip.renders) {
      const wrap = document.createElement("div");
      wrap.style.flex = "1 1 280px"; wrap.style.minWidth = "0";
      wrap.innerHTML = `<h4>${r.label}</h4>`;
      const rv = document.createElement("video");
      rv.src = base + r.file; rv.muted = true; rv.playsInline = true; rv.preload = "auto";
      rv.style.width = "100%"; rv.style.borderRadius = "8px"; rv.style.background = "#080b0f";
      wrap.appendChild(rv); $("renders").appendChild(wrap); renderVideos.push(rv);
    }
  }

  const pane = createPane($("skelBox"), clip, 0x9ad0ff);

  // 視点は**元の映像と同じ横向き・目の高さ**を既定にする。
  //
  // 以前は斜め上から見下ろす位置に置いていた。見た目は立体的だが、
  // 見下ろす視点では鉛直線が下に向かって外側へ開く（透視の消失点）ので、
  // **真っ直ぐ立っている体が傾いて見える**。実際に「3D復元が左に傾いて
  // ありえない」と指摘され、正面図で確かめたら体は鉛直から数度しか
  // 傾いていなかった。元映像と見比べる用途では、映像と同じ視点に置く。
  //
  // toDisplay は腰の左→右を +X に揃えるので、投球なら投球方向が X 軸、
  // 横から撮った映像の奥行きが Z 軸になる。カメラを −Z 側に置くと
  // +X が画面左に来て、映像と左右が合う。
  const fit = (function () {
    let lo = [ Infinity,  Infinity,  Infinity];
    let hi = [-Infinity, -Infinity, -Infinity];
    for (const fr of pane.disp) for (const p of fr) for (let k = 0; k < 3; k++) {
      if (p[k] < lo[k]) lo[k] = p[k];
      if (p[k] > hi[k]) hi[k] = p[k];
    }
    const c = [(lo[0] + hi[0]) / 2, (lo[1] + hi[1]) / 2, (lo[2] + hi[2]) / 2];
    const h = Math.max(hi[1] - lo[1], 1.4);
    const w = Math.max(hi[0] - lo[0], 1.0);
    const t = Math.tan(pane.camera.fov * Math.PI / 360);
    const a = pane.camera.aspect || 1;
    const dist = Math.max(h / (2 * t), w / (2 * t * a)) * 1.2 + 0.4;
    return { c, dist };
  })();
  function viewFromSide() {
    // 撮影カメラの方向。カメラ空間で返す手法（SAM 3D Body）なら原点がカメラで、
    // 被写体はその **+Z 側**にいる（OpenCV の慣習）。被写体から見たカメラは −Z。
    // それを表示座標へ回せば、推測なしで元映像と同じ向きになる。
    //
    // 一度これを +Z に「直して」左右を逆にした。映像の中で投手がどちらへ
    // 踏み出しているかを私が見誤ったのが原因で、人物検出の箱の移動
    // （x 830px → 2400px、画面右）と生座標の骨盤 x（+1.24m）が同じ符号だった
    // ことで OpenCV 側だと確定した。**向きを疑うときは箱の移動と比べること。**
    //
    // 世界座標の手法（GVHMR）ではカメラ位置が分からないので、腰の向きから
    // 横向きを作る従来の推測に落とす（撮り方によっては左右が逆になりうる）。
    let dir;
    if (clip.coords === "camera") {
      const d = toDisplayDir(clip, [0, 0, -1]);
      const n = Math.hypot(d[0], d[2]) || 1;           // 水平成分だけ使い、目の高さに置く
      dir = [d[0] / n, 0, d[2] / n];
    } else {
      dir = [0, 0, -1];
    }
    pane.camera.position.set(fit.c[0] + dir[0] * fit.dist,
                             fit.c[1] + fit.dist * 0.06,
                             fit.c[2] + dir[2] * fit.dist);
    pane.controls.target.set(fit.c[0], fit.c[1], fit.c[2]);
    pane.controls.update();
  }
  viewFromSide();
  $("viewBtn").onclick = viewFromSide;

  window.__clip = { clip, pane };            // ローカル検証用

  // 局面へ飛ぶボタン。デモではここを押して見せるのが一番伝わる
  $("phases").innerHTML = clip.phase_list.map(p =>
    `<button class="phase" data-f="${p.frame}">`
    + `<span class="tag" style="background:${hex(p.color)}"></span>`
    + `${p.label} <span class="meta">${p.t.toFixed(2)}s</span></button>`).join("");
  for (const b of $("phases").querySelectorAll("button")) {
    b.onclick = () => { playing = false; $("play").textContent = "▶ 再生"; apply(+b.dataset.f); };
  }

  const scrub = $("scrub"), play = $("play");
  scrub.max = String(pane.frames - 1);
  let f = 0, playing = false;
  let speed = parseFloat($("speed").value);
  $("speed").onchange = () => { speed = parseFloat($("speed").value); if (video) video.playbackRate = speed; };

  // 音声の帯（issue 013）。声量・響き・姿勢の系列を同じ時間軸に描き、再生位置を重ねる
  const strip = buildStrip(clip, pane.frames, v => { playing = false; stopVideo(); play.textContent = "▶ 再生"; apply(v); });
  const sound = $("sound");
  function stopVideo() { if (video && !video.paused) video.pause(); }

  function apply(v, fromVideo = false) {
    f = Math.max(0, Math.min(pane.frames - 1, Math.round(v)));
    scrub.value = String(f);
    pane.setFrame(f);
    // 動画は自前で再生せず、常にフレーム番号から時刻を決める。
    // video.play() に任せると 3D 側とじわじわずれる。
    // 動画は**再生fps**で時刻を決める（撮影fpsではない）。スロー映像では両者が違う
    // 例外: 「音を出して再生」のときは動画が主で、3D が動画の時刻に追従する（fromVideo）
    if (video && video.readyState >= 1 && !fromVideo)
      video.currentTime = (clip.video_start_s || 0) + f / (clip.video_fps || clip.fps);
    if (strip) strip.draw(f);
    // レンダ動画は復元と同じフレーム列（切り出し後の動画から作られる）なので start は足さない
    for (const rv of renderVideos) if (rv.readyState >= 1) rv.currentTime = f / (clip.video_fps || clip.fps);
    const here = clip.phase_list.filter(p => p.frame === f).map(p => p.label).join("　");
    $("meta").textContent = `frame ${f} / ${scrub.max}　${(f / clip.fps).toFixed(2)}s`
      + (here ? `　← ${here}` : "");
  }
  scrub.oninput = () => { playing = false; stopVideo(); play.textContent = "▶ 再生"; apply(scrub.value); };
  play.onclick = () => {
    playing = !playing; play.textContent = playing ? "⏸ 停止" : "▶ 再生";
    if (video && sound && sound.checked) {
      if (playing) { video.muted = false; video.playbackRate = speed; video.play(); } else stopVideo();
    }
  };

  if (video) video.addEventListener("loadeddata", () => apply(f), { once: true });
  apply(0);

  let prev = 0, acc = 0;
  function loop(now) {
    const dt = Math.min((now - prev) / 1000, 0.1); prev = now;
    if (playing && video && sound && sound.checked && !video.paused) {
      // 動画が主。動画の時刻からフレームを引く（音と口の動きがずれない）
      const vf = Math.round((video.currentTime - (clip.video_start_s || 0)) * (clip.video_fps || clip.fps));
      if (vf !== f) apply(vf, true);
      if (video.ended || vf >= pane.frames - 1) { playing = false; stopVideo(); play.textContent = "▶ 再生"; }
    } else if (playing) {
      acc += dt * clip.fps * speed;
      if (acc >= 1) { const s = Math.floor(acc); acc -= s; apply((f + s) % pane.frames); }
    }
    pane.render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

main();
</script>
