<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>サーブ比較 — 同じ体で並べる</title>
<style>
  :root { --bg:#0f1216; --card:#1a1f27; --line:#2a323d; --fg:#e7ecf2; --muted:#94a3b8;
          --accent:#2563eb; --warn:#f59e0b; --mine:#60a5fa; --ref:#f472b6; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family: -apple-system, "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
         line-height:1.7; }
  header { padding:18px 24px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:18px; font-weight:600; }
  header p { margin:4px 0 0; color:var(--muted); font-size:13px; }
  header a { color:var(--muted); font-size:12px; }
  main { max-width:1100px; margin:0 auto; padding:20px 24px 40px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:16px 18px; margin-bottom:16px; }
  button { background:#374151; color:#fff; border:0; border-radius:8px;
           padding:7px 14px; font-size:13px; font-weight:600; cursor:pointer; }
  button.on { background:var(--accent); }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .grow { flex:1; }
  #view { width:100%; height:480px; background:#0b0e12; border-radius:8px; }
  input[type=range]{ width:100%; }
  .legend { display:flex; gap:18px; font-size:13px; margin-top:4px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%;
         margin-right:6px; vertical-align:middle; }
  .warn { background:#2a1f14; border:1px solid #7c5a1e; color:#fcd9a0;
          border-radius:8px; padding:10px 14px; font-size:13px; margin-bottom:14px; }
  .note { color:var(--muted); font-size:12px; margin-top:8px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { padding:7px 6px; border-bottom:1px solid var(--line); text-align:right; }
  th:first-child, td:first-child { text-align:left; color:var(--muted); }
  th { color:var(--muted); font-weight:500; font-size:12px; }
  td.m { color:var(--mine); } td.r { color:var(--ref); }
  .phase { display:flex; justify-content:space-between; color:var(--muted);
           font-size:11px; margin-top:2px; }
  .status { color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<header>
  <h1>⚖️ サーブ比較 — 同じ体で並べる</h1>
  <p>2つの動きを同じアバターに流し込むので、体格差が消え、残る差は技術の差になります。</p>
  <a href="index.html">← 単体の解析へ</a>
</header>

<main>
  <div id="warnings"></div>

  <div class="card">
    <div class="row">
      <button id="modeBtn" class="on">🫱🫲 並べる</button>
      <button id="playBtn">⏸</button>
      <div class="grow"></div>
      <div class="legend">
        <span><span class="dot" style="background:var(--mine)"></span><b id="lblMine">あなた</b></span>
        <span><span class="dot" style="background:var(--ref)"></span><b id="lblRef">お手本</b></span>
      </div>
    </div>

    <div id="view" style="margin-top:12px"></div>

    <div style="margin-top:10px">
      <input type="range" id="scrub" min="-150" max="200" value="-100" />
      <div class="phase">
        <span>← 構え</span><span>沈み込み</span><span>打点</span><span>フォロースルー →</span>
      </div>
    </div>
    <div class="note" id="posNote"></div>
    <div class="note">
      スライダーは<b>動作の局面</b>で揃えてあります。スイングの速さや fps が違っても、
      同じ瞬間どうしが並びます。ドラッグで回転・スクロールでズーム。
    </div>
  </div>

  <div class="card">
    <h3 style="margin:0 0 10px; font-size:15px">数値の比較</h3>
    <table id="metrics"></table>
    <div class="note">
      同じ体に揃えているので、体格の違いによる差はありません。ただし
      <b>お手本と同じ角度が出せるか</b>は可動域しだいで、到達できる保証はありません。
    </div>
  </div>

  <div class="card" id="loading">
    <div class="status" id="status">読み込み中…</div>
  </div>
</main>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
  "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.js"
}}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { createAvatar } from "./avatar.js";

const $ = (id) => document.getElementById(id);
const AVATAR = "avatar/avatar.vrm";
const SEP = 0.9;               // 「並べる」ときの左右の間隔[m]

/**
 * 動作の局面で時間を揃える。
 * 沈み込みを t=0、打点を t=1 として、各クリップの自分のフレームに写す。
 * これで撮影fpsもスイングの速さも吸収される。
 */
function frameAt(clip, t) {
  const { loading, contact } = clip.metrics.phases;
  const N = clip.joints.length;
  const span = contact - loading;
  let f;
  if (span >= 3) {
    f = Math.round(loading + t * span);
  } else {
    // フェーズが検出できていないクリップは、全体を比例配分して並べる
    f = Math.round(((t + 1.5) / 3.5) * (N - 1));
  }
  return Math.max(0, Math.min(N - 1, f));
}

function setStatus(msg) {
  $("loading").style.display = msg ? "" : "none";
  $("status").textContent = msg;
}

function showWarnings(clips) {
  const box = $("warnings");
  box.innerHTML = "";
  for (const c of clips) {
    const issues = c.quality?.issues || [];
    if (!issues.length) continue;
    const d = document.createElement("div");
    d.className = "warn";
    d.innerHTML = `<b>⚠️ 「${c.label}」の復元に問題があります</b><br>`
      + issues.map(s => "・" + s).join("<br>")
      + "<br><span style='opacity:.8'>比較結果はこの素材の問題を反映します。"
      + "解析の不具合ではありません。</span>";
    box.appendChild(d);
  }
}

function metricsTable(mine, ref) {
  const rows = [
    ["撮影fps", c => `${c.fps.toFixed(0)}`],
    ["沈み込み → 打点", c => {
      const p = c.metrics.phases, s = p.contact - p.loading;
      return `${s} フレーム（${(s / c.fps).toFixed(2)} 秒）`;
    }],
    ["重心の伸び上がり", c => `${(c.metrics.com_rise_m * 100).toFixed(1)} cm`],
    ["沈み込み膝角", c => `${c.metrics.min_knee_deg_overall.toFixed(0)}°`],
    ["打点の肘角", c => `${c.metrics.elbow_at_contact_deg.toFixed(0)}°`],
    ["打点タイミング", c => `${c.metrics.contact_vs_compeak_s >= 0 ? "+" : ""}`
      + `${c.metrics.contact_vs_compeak_s.toFixed(2)} 秒`],
    ["体幹の傾き(接球時)", c => `${c.metrics.trunk_lean_at_contact_deg.toFixed(0)}°`],
  ];
  $("metrics").innerHTML =
    `<tr><th>指標</th><th>${mine.label}</th><th>${ref.label}</th></tr>`
    + rows.map(([k, f]) =>
        `<tr><td>${k}</td><td class="m">${f(mine)}</td><td class="r">${f(ref)}</td></tr>`
      ).join("");
}

async function main() {
  let mine, ref;
  try {
    [mine, ref] = await Promise.all(
      ["data/mine.json", "data/reference.json"].map(u =>
        fetch(u).then(r => { if (!r.ok) throw new Error(u + " が見つかりません"); return r.json(); })));
  } catch (e) {
    setStatus(`${e.message}  — tools/make_compare.py で生成してください`);
    return;
  }
  $("lblMine").textContent = mine.label;
  $("lblRef").textContent = ref.label;
  showWarnings([mine, ref]);
  metricsTable(mine, ref);

  // ---- 3D ----
  const host = $("view");
  const W = host.clientWidth || 900, H = host.clientHeight || 480;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, W / H, 0.01, 100);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(W, H); renderer.setPixelRatio(devicePixelRatio);
  host.appendChild(renderer.domElement);
  const controls = new OrbitControls(camera, renderer.domElement);
  camera.position.set(3.2, 1.5, 3.4); controls.target.set(0, 0.85, 0);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
  const key = new THREE.DirectionalLight(0xffffff, 1.1);
  key.position.set(2, 3, 2); scene.add(key);
  scene.add(new THREE.GridHelper(6, 12, 0x333a44, 0x222831));

  new ResizeObserver(() => {
    const w = host.clientWidth || W, h = host.clientHeight || H;
    camera.aspect = w / h; camera.updateProjectionMatrix(); renderer.setSize(w, h);
  }).observe(host);

  setStatus("アバターを読み込み中…（初回は少し待ちます）");
  let a, b;
  try {
    // 同じアバターを2体。体が同一なので、差はすべて動きの差になる。
    a = await createAvatar(AVATAR, mine.joints, mine.pose);
    b = await createAvatar(AVATAR, ref.joints, ref.pose);
  } catch (e) {
    setStatus("アバターを読み込めません: " + e.message);
    return;
  }
  a.attachRacket(mine.metrics.racket_side === "L" ? "left" : "right");
  b.attachRacket(ref.metrics.racket_side === "L" ? "left" : "right");
  scene.add(a.root); scene.add(b.root);
  tint(b.root, 0xf472b6);          // お手本を色分け
  setStatus("");

  function tint(root, hex) {
    root.traverse(o => {
      if (!o.material) return;
      for (const m of [].concat(o.material)) {
        if (m.color) m.color.lerp(new THREE.Color(hex), 0.55);
      }
    });
  }
  function ghost(root, on) {
    root.traverse(o => {
      if (!o.material) return;
      for (const m of [].concat(o.material)) {
        m.transparent = on;
        m.opacity = on ? 0.45 : 1.0;
        m.depthWrite = !on;
        m.needsUpdate = true;
      }
    });
  }

  // ---- 表示モード ----
  let side = true;
  const modeBtn = $("modeBtn");
  function applyMode() {
    const dx = side ? SEP : 0;
    a.root.position.x = -dx; b.root.position.x = dx;
    ghost(a.root, !side); ghost(b.root, !side);
    modeBtn.textContent = side ? "🫱🫲 並べる" : "👥 重ねる";
    modeBtn.classList.toggle("on", side);
  }
  modeBtn.onclick = () => { side = !side; applyMode(); };
  applyMode();

  // ---- 局面で揃えた再生 ----
  const scrub = $("scrub");
  const hips = new THREE.Vector3();
  function show(t) {
    for (const [clip, av] of [[mine, a], [ref, b]]) {
      const f = frameAt(clip, t);
      const j = clip.joints[f];
      const [ax, sg] = clip.up_axis;
      const horiz = [0, 1, 2].filter(k => k !== ax);
      // 足元を原点に合わせる（クリップごとに立ち位置が違うため）
      hips.set(0, j[0][ax] * sg - clip.groundY, 0);
      av.applyFrame(f, hips);
      clip._f = f;
    }
    $("posNote").textContent =
      `${mine.label}: frame ${mine._f} (${(mine._f / mine.fps).toFixed(2)}s)　／　`
      + `${ref.label}: frame ${ref._f} (${(ref._f / ref.fps).toFixed(2)}s)`;
  }
  // 各クリップの地面高さ（足の最低点）を求めて、立ち位置を揃える
  for (const clip of [mine, ref]) {
    const [ax, sg] = clip.up_axis;
    let lo = Infinity;
    for (const fr of clip.joints)
      for (const idx of [7, 8, 10, 11]) lo = Math.min(lo, fr[idx][ax] * sg);
    clip.groundY = lo;
  }

  let playing = true, t = -1.0, last = 0;
  const playBtn = $("playBtn");
  playBtn.onclick = () => {
    playing = !playing; playBtn.textContent = playing ? "⏸" : "▶";
  };
  scrub.oninput = () => {
    playing = false; playBtn.textContent = "▶";
    t = parseFloat(scrub.value) / 100; show(t);
  };

  function loop(now) {
    controls.update();
    if (playing && now - last > 33) {
      t += 0.02; if (t > 2.0) t = -1.5;
      scrub.value = String(Math.round(t * 100));
      show(t); last = now;
    }
    a.update(0.016); b.update(0.016);
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  show(t); requestAnimationFrame(loop);
}

main();
</script>
</body>
</html>
